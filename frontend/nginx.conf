server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ── Compression ──────────────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  # ── Security headers ─────────────────────────────────────────────────────────
  # CSP intentionally omitted: Razorpay checkout, Cloudinary CDN, and
  # Google/Groq AI endpoints require a CSP audit before enforcement.
  add_header X-Frame-Options          "SAMEORIGIN"                          always;
  add_header X-Content-Type-Options   "nosniff"                             always;
  add_header Referrer-Policy          "strict-origin-when-cross-origin"     always;
  add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

  # ── Caching ──────────────────────────────────────────────────────────────────
  # Vite outputs content-hashed filenames for JS/CSS — safe to cache forever.
  location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must not be cached so users always get the latest SPA shell.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  # ── SPA routing ──────────────────────────────────────────────────────────────
  location / {
    try_files $uri $uri/ /index.html;
  }
}
